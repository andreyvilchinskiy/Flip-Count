server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Основные страницы
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика (JS, CSS). Время кеша уменьшено до 30 минут,
    # чтобы при разработке изменения подхватывались быстрее.
    location ~* \.(css|js|png|jpg|svg|woff2?)$ {
        expires 30m;
        add_header Cache-Control "public";
        try_files $uri =404; # Если файла нет — честная ошибка 404, а не HTML
    }

    # HTML не кэшируем вообще
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
}