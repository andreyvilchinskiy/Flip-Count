<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки профиля — Flip Count</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="space-bg" aria-hidden="true"></div>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="profile.html" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>К профилям</span>
            </a>
            <a href="index.html" class="logo">Flip Count</a>
        </div>
    </header>

    <div class="page-wrapper" style="max-width: 600px;">
        <div class="page-header">
            <h1>Настройки профиля</h1>
            <p>Загрузите картинку и задайте название профиля</p>
        </div>

        <div class="panel">
            <h3>Внешний вид</h3>

            <div class="profile-settings-avatar" id="avatarBox">
                <div class="profile-letter" id="avatarLetter">?</div>
                <div class="upload-overlay">Нажмите, чтобы<br>загрузить картинку</div>
            </div>
            <input type="file" id="avatarInput" class="file-input-hidden" accept="image/jpeg,image/jpg,image/png">
            <p style="text-align: center; color: #94A3B8; font-size: 13px; margin-bottom: 24px;">
                JPG или PNG, до 5 МБ
            </p>

            <div class="form-group">
                <label for="profileName">Название профиля</label>
                <input type="text" id="profileName" placeholder="Название профиля" maxlength="40">
            </div>

            <button class="form-btn" id="saveBtn">Сохранить изменения</button>

            <button class="form-btn" id="deleteBtn"
                    style="background: linear-gradient(135deg, #EF4444, #DC2626); margin-top: 10px;">
                Удалить профиль
            </button>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/page-profile-settings.js"></script>
</body>
</html>
