<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Flip Count</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="space-bg" aria-hidden="true"></div>

    <header class="navbar">
        <div class="navbar-inner">
            <a href="login.html" class="back-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Назад</span>
            </a>
            <a href="index.html" class="logo">Flip Count</a>
        </div>
    </header>

    <main class="form-container">
        <div class="form-card">
            <h2>Регистрация</h2>
            <p class="form-subtitle">Создайте аккаунт Flip Count</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="nickname">Никнейм</label>
                    <input type="text" id="nickname" placeholder="Ваш никнейм" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="password2">Подтверждение пароля</label>
                    <input type="password" id="password2" placeholder="••••••••" required>
                </div>

                <button type="submit" class="form-btn">Зарегистрироваться</button>
            </form>

            <p class="form-switch">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('nickname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                showToast('Пароли не совпадают', 'info');
                return;
            }

            try {
                await API.register(nickname, email, password);
                showToast('Регистрация успешна!', 'success');
                setTimeout(() => window.location.href = 'login.html', 700);
            } catch (err) {
                showToast(err.message || 'Ошибка регистрации', 'info');
            }
        });
    </script>
</body>
</html>
